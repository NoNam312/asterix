<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Locked · QuestLog</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--surface);
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 440px;
        padding: 28px;
        box-shadow: 0 8px 30px rgb(0 0 0 / 0.06);
      }
      .lock {
        font-size: 40px;
      }
      h1 {
        font-size: 22px;
        letter-spacing: -0.01em;
      }
      .big {
        font-size: 30px;
        font-weight: 700;
      }
      .actions {
        display: grid;
        gap: 8px;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <main class="card stack">
      <div class="row">
        <div class="logo"><span class="logo-mark">⚔</span> QuestLog</div>
        <span id="pill" class="pill locked">🔒 Locked</span>
      </div>

      <div style="margin-top: 20px">
        <p class="lock" id="icon">🔒</p>
        <h1 id="title">This site is locked</h1>
        <p id="subtitle" class="muted" style="margin-top: 4px">Finish your quests to unlock it.</p>
      </div>

      <div id="progress">
        <p class="big"><span id="earned">0</span><span class="muted small"> / <span id="goal">0</span> XP today</span></p>
        <div class="bar" style="margin-top: 6px"><div id="bar" style="width: 0"></div></div>
        <p id="left" class="muted small" style="margin-top: 6px"></p>
      </div>

      <p id="allowed" class="muted small"></p>
      <p id="error" class="error hidden"></p>

      <div class="actions">
        <a id="open-app" class="btn primary">Go to my quests</a>
        <a id="continue" class="btn primary hidden">Continue to site</a>
        <button id="emergency" class="btn danger"></button>
        <button id="refresh" class="btn link small">Check again</button>
      </div>
    </main>

    <script type="module" src="blocked.js"></script>
  </body>
</html>
